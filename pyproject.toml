[project]
name = "onepage-teaser"
version = "0.1.0"
description = "Turn an investor pitch deck into a reviewed, one-page investor teaser PDF."
requires-python = ">=3.11"
dependencies = [
    "streamlit>=1.45",
    "pymupdf>=1.24",
    "python-pptx>=1.0",
    "reportlab>=4.0",
    "pydantic>=2.7",
    "python-dotenv>=1.0",
    "rapidfuzz>=3.0",
    "pillow>=10.0",
    "python-docx>=1.1",
    "anthropic>=0.125",
]

[project.optional-dependencies]
openai = ["openai>=1.40"]
ocr = ["rapidocr-onnxruntime>=1.2", "numpy>=1.26"]
dev = ["pytest>=8.0", "ruff>=0.5"]

[tool.setuptools]
packages = ["teaser", "teaser.ingest", "teaser.extract", "teaser.render"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = [
    "ignore::DeprecationWarning:pymupdf.*",
]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]
ignore = ["E501"]
